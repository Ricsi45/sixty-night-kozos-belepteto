<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>SIXTY NIGHT PARTY – Karszalag</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:620px;margin:auto;padding:16px}
header,.card{background:#151515;border:1px solid #303030;border-radius:18px}
header{padding:22px 14px;text-align:center}h1{font-size:26px;margin:0}.sub{color:#aaa;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{padding:17px;text-align:center}
.green{border-color:#16b34a}.red{border-color:#e11d2e}.label{font-weight:800;font-size:17px}.num{font-size:48px;font-weight:900;margin-top:5px}
.total{margin-top:12px}.scan{margin-top:12px;padding:14px}
video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#000}
#start{margin-top:12px;width:100%;padding:16px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:900;font-size:17px}
#stop{display:none;margin-top:10px;width:100%;padding:13px;border:1px solid #555;border-radius:13px;background:#222;color:#fff;font-weight:800}
.status{margin-top:12px;padding:16px;border-radius:13px;text-align:center;font-weight:900;background:#222}
.okg{background:#0b4d27;border:2px solid #16b34a}.okr{background:#55131c;border:2px solid #e11d2e}.bad{background:#4a1a1a;border:2px solid #e11d2e}
.small{font-size:13px;color:#999;text-align:center;line-height:1.45;margin:12px 3px}
#reset{margin-top:10px;width:100%;padding:13px;border:1px solid #555;border-radius:13px;background:#151515;color:#fff;font-weight:800}
</style>
</head>
<body>
<main>
<header><h1>SIXTY NIGHT PARTY</h1><div class="sub">Karszalag-regisztráció</div></header>

<section class="stats">
<div class="card green"><div class="label">🟢 18 év alatt</div><div class="num" id="under">0</div></div>
<div class="card red"><div class="label">🔴 18+</div><div class="num" id="over">0</div></div>
</section>

<div class="card total"><div class="label">🎟️ Összes karszalag</div><div class="num" id="total">0</div></div>

<div class="card scan">
<video id="video" playsinline muted></video>
<button id="start">📷 Kamera engedélyezése</button>
<button id="stop">Kamera leállítása</button>
<div id="status" class="status">A kezdéshez engedélyezd a kamerát.</div>
</div>

<button id="reset">Számláló nullázása</button>
<div class="small">A rendszer automatikusan a telefon hátlapi kameráját próbálja használni. Nincs kamera-választó menü.</div>
<div class="small">🟢 A zöld QR = 18 év alatt • 🔴 A piros QR = 18+</div>
</main>

<script>
const KEY="sixty_night_karszalag_hu_v2";
let d=JSON.parse(localStorage.getItem(KEY)||'{"under":0,"over":0}');
let stream=null, running=false, locked=false, last="";
const video=document.getElementById("video"), canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true});

function render(){document.getElementById("under").textContent=d.under;document.getElementById("over").textContent=d.over;document.getElementById("total").textContent=d.under+d.over;localStorage.setItem(KEY,JSON.stringify(d));}
function status(text,cls=""){const e=document.getElementById("status");e.textContent=text;e.className="status "+cls;}
function processQR(raw){
 if(locked)return;
 const s=String(raw||"").trim().toUpperCase();
 let type=null;
 if(s.includes("18_ALATT") || s.includes("18 ALATT")) type="under";
 else if(s.includes("18_PLUS") || s.includes("18+") || s.includes("18 PLUS")) type="over";
 if(!type){status("❌ Ismeretlen QR-kód – nem számoltam.","bad");locked=true;setTimeout(()=>{locked=false;status("Következő karszalag beolvasható.");},1400);return;}
 d[type]++;render();locked=true;
 if(type==="under") status("🟢 18 ÉV ALATTI KARSZALAG +1","okg");
 else status("🔴 18+ KARSZALAG +1","okr");
 if(navigator.vibrate)navigator.vibrate(100);
 setTimeout(()=>{locked=false;status("Következő karszalag beolvasható.");},1000);
}
async function startCamera(){
 try{
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
   video.srcObject=stream; await video.play(); running=true;
   document.getElementById("start").style.display="none";document.getElementById("stop").style.display="block";
   status("Kamera aktív – tartsd elé a QR-kódot.");
   requestAnimationFrame(scan);
 }catch(e){
   status("❌ A kamera nem engedélyezhető. Engedélyezd a kamerát a böngésző beállításaiban.","bad");
 }
}
function stopCamera(){
 running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
 video.srcObject=null;document.getElementById("start").style.display="block";document.getElementById("stop").style.display="none";
 status("A kamera leállítva.");
}
function scan(){
 if(!running)return;
 if(video.readyState>=2 && video.videoWidth){
   canvas.width=video.videoWidth;canvas.height=video.videoHeight;
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
   const img=ctx.getImageData(0,0,canvas.width,canvas.height);
   const q=jsQR(img.data,img.width,img.height,{inversionAttempts:"attemptBoth"});
   if(q && q.data!==last){last=q.data;processQR(q.data);setTimeout(()=>last="",1000);}
 }
 requestAnimationFrame(scan);
}
document.getElementById("start").onclick=startCamera;
document.getElementById("stop").onclick=stopCamera;
document.getElementById("reset").onclick=()=>{if(confirm("Biztosan nullázod a számlálót ezen a telefonon?")){d={under:0,over:0};render();status("Számláló nullázva.");}};
render();
</script>
</body>
</html>
